name: SMARD Ingestion

on:
  schedule:
    # SMARD Ist-Werte werden stündlich aktualisiert.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      num_blocks:
        description: "Wie viele Wochen-Blöcke pro Filter"
        required: false
        default: "2"

concurrency:
  group: smard-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installieren
        run: pip install -r requirements-ingest.txt

      - name: Ingestion ausführen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NUM_BLOCKS: ${{ github.event.inputs.num_blocks || 2 }}
        run: python ingest.py "$NUM_BLOCKS"
